name: Notizen-App APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'notizen/**'
      - '.github/workflows/notizen.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Debug-APK bauen
        working-directory: notizen
        run: gradle --no-daemon assembleDebug
      - name: APK als Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp notizen/app/build/outputs/apk/debug/app-debug.apk notizen.apk
          gh release create "notizen-${{ github.run_number }}" notizen.apk \
            --target "${{ github.sha }}" --prerelease \
            --title "Notizen Build ${{ github.run_number }}" \
            --notes "Debug-APK der Notizen-App. Nach dem Installieren über die vorige Version bleiben die Notizen erhalten."
