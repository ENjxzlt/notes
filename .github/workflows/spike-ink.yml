name: Ink-Spike APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'spike-ink/**'
      - '.github/workflows/spike-ink.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Debug-APK bauen
        working-directory: spike-ink
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ink-spike-apk
          path: spike-ink/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: APK als Release veröffentlichen (direkter Download, ohne ZIP)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp spike-ink/app/build/outputs/apk/debug/app-debug.apk ink-spike.apk
          gh release create "spike-ink-${{ github.run_number }}" ink-spike.apk \
            --target "${{ github.sha }}" --prerelease \
            --title "Ink-Spike Build ${{ github.run_number }}" \
            --notes "Debug-APK zum Testen auf dem Tablet."
